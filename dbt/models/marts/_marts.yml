
version: 2

models:
  - name: dim_customers
    description: Customer dimension.
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

  - name: dim_products
    description: Product dimension with English category names.
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

  - name: dim_sellers
    description: Seller dimension.
    columns:
      - name: seller_id
        data_tests:
          - not_null
          - unique

  - name: dim_date
    description: Calendar dimension.
    columns:
      - name: date_key
        data_tests:
          - not_null
          - unique
      - name: date_day
        data_tests:
          - not_null
          - unique

  - name: fact_order_items
    description: One record per order item.
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: order_item_id
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id

  - name: fact_payments
    description: One record per payment sequence per order.
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_sequential
        data_tests:
          - not_null

  - name: fact_reviews
    description: One record per review and order.
    columns:
      - name: review_id
        data_tests:
          - not_null
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
